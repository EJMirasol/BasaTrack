name: basa_track
description: A beautiful Flutter app for tracking daily Bible reading with streaks and motivation.
publish_to: 'none'
version: 1.26.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  
  # UI/Animations
  lottie: ^3.0.0
  google_fonts: ^7.0.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Connectivity
  connectivity_plus: ^7.0.0

  # File Handling & Sharing
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  
  # URL Launcher (for email feedback)
  url_launcher: ^6.3.1

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^33.1.45

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.0.1
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_test: ^1.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/PDF/
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Merriweather
      fonts:
        - asset: assets/google_fonts/Merriweather-Bold.ttf
          weight: 700
