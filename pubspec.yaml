name: basa_track
description: A beautiful Flutter app for tracking daily Bible reading with streaks and motivation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  
  # UI/Animations
  lottie: ^3.0.0
  google_fonts: ^7.0.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^6.1.1
  
  # Network
  connectivity_plus: ^7.0.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Merriweather
      fonts:
        - asset: assets/google_fonts/Merriweather-Bold.ttf
          weight: 700
